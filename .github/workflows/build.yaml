name: Build and push

on:
  push:
    branches: [main]
  schedule:
    # Rebuild weekly to pick up Alpine edge NSD updates
    - cron: "0 6 * * 1"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Get NSD and Alpine versions
        id: versions
        run: |
          NSD_VERSION=$(docker run --rm alpine:edge sh -c 'apk update -q && apk search -e nsd' | grep '^nsd-[0-9]' | sed 's/nsd-\([0-9.]*\).*/\1/')
          ALPINE_VERSION=$(docker run --rm alpine:edge cat /etc/alpine-release)
          echo "NSD version: ${NSD_VERSION}"
          echo "Alpine version: ${ALPINE_VERSION}"
          echo "nsd=${NSD_VERSION}" >> $GITHUB_OUTPUT
          echo "alpine=${ALPINE_VERSION}" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nsd-alpine:latest
            ghcr.io/${{ github.repository_owner }}/nsd-alpine:${{ steps.versions.outputs.nsd }}-alpine${{ steps.versions.outputs.alpine }}
