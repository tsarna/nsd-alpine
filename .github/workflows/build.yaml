name: Build and push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Determine NSD and Alpine versions
        id: versions
        run: |
          NSD_VERSION=$(docker run --rm alpine:3.24 sh -c 'apk update -q && apk search -e nsd' \
            | sed -n 's/^nsd-\([0-9][0-9.]*\).*/\1/p')
          ALPINE_VERSION=$(docker run --rm alpine:3.24 cat /etc/alpine-release)
          ALPINE_MINOR=${ALPINE_VERSION%.*}
          NSD_MINOR=${NSD_VERSION%.*}
          NSD_MAJOR=${NSD_VERSION%%.*}
          echo "NSD version: ${NSD_VERSION} (major ${NSD_MAJOR}, minor ${NSD_MINOR})"
          echo "Alpine version: ${ALPINE_VERSION} (minor ${ALPINE_MINOR})"
          {
            echo "nsd=${NSD_VERSION}"
            echo "nsd_minor=${NSD_MINOR}"
            echo "nsd_major=${NSD_MAJOR}"
            echo "alpine_minor=${ALPINE_MINOR}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/nsd-alpine
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.versions.outputs.nsd_major }},enable={{is_default_branch}}
            type=raw,value=${{ steps.versions.outputs.nsd_minor }},enable={{is_default_branch}}
            type=raw,value=${{ steps.versions.outputs.nsd }},enable={{is_default_branch}}
            type=raw,value=${{ steps.versions.outputs.nsd }}-alpine${{ steps.versions.outputs.alpine_minor }},enable={{is_default_branch}}

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # One check for branch protection to require, instead of naming this
  # workflow's jobs: the gate is *handed* their results, so adding, renaming or
  # splitting a job here never means editing a protection rule again. It is also
  # where a red Renovate PR is handed to a Devin session -- a sibling job, never
  # a dependency of the gate, so it cannot affect this check's conclusion.
  # Definition and the full list of handoff preconditions: tsarna/ci-shared.
  #
  # All four permissions are required even though only the handoff uses them:
  # GitHub checks statically that no job in a called workflow requests more than
  # the caller grants, and fails the whole run at startup if one does -- skipped
  # jobs included.
  ci-success:
    name: CI Success
    if: always()
    needs: [build]
    permissions:
      actions: read
      contents: read
      pull-requests: write
      id-token: write
    # Pinned by commit, as a moving tag here would let anyone who could push one
    # to ci-shared run code in every calling repo. Renovate keeps it current
    # from the trailing version comment.
    uses: tsarna/ci-shared/.github/workflows/ci-gate.yml@621c3863df12355a95883b304be52831e2161b0a # v1.1.0
    with:
      needs: ${{ toJSON(needs) }}
