name: Build and push

on:
  push:
    branches: [main]
  schedule:
    # Rebuild weekly to pick up Alpine edge NSD updates
    - cron: "0 6 * * 1"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get NSD version from image
        id: nsd_version
        run: |
          docker buildx build --load --platform linux/amd64 -t nsd-local .
          VERSION=$(docker run --rm --entrypoint /usr/sbin/nsd nsd-local -v 2>&1 | grep -oP 'NSD \K[0-9]+\.[0-9]+\.[0-9]+')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nsd-alpine:latest
            ghcr.io/${{ github.repository_owner }}/nsd-alpine:${{ steps.nsd_version.outputs.version }}
